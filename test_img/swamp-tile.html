<div id="swamp-tile-fixture">
  <div class="viz-grid">
    <figure><figcaption>Swamp tile · 640 × 640 · 30° view</figcaption><canvas id="swamp-source" width="640" height="640" role="img" aria-label="A transparent swamp hex tile viewed at a thirty-degree elevation, with green pools, lily pads, cypress trees, reeds and mossy roots."></canvas></figure>
    <figure><figcaption>Nearest-neighbor · 64 × 64</figcaption><canvas id="swamp-small" width="64" height="64" role="img" aria-label="The same swamp tile reduced to sixty-four pixels, enlarged without smoothing for comparison."></canvas></figure>
  </div>
</div>
<style>
  #swamp-tile-fixture figure { margin: 0; min-width: 0; }
  #swamp-tile-fixture figcaption { color: var(--foreground); margin-bottom: 8px; }
  #swamp-tile-fixture canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; background-color: var(--background); background-image: conic-gradient(var(--muted) 25%, transparent 0 50%, var(--muted) 0 75%, transparent 0); background-size: 20px 20px; }
</style>
<script>
(() => {
  const root = document.getElementById('swamp-tile-fixture');
  const canvas = root.querySelector('#swamp-source');
  const ctx = canvas.getContext('2d');
  // A reproducible drawing fixture, independent of the Pixel Snapper engine.
  // Elevation is measured above the terrain plane. No antialiasing is used.
  const elevation = 30 * Math.PI / 180;
  const palette = {
    peat: '#29332c', peatLit: '#454438', rootDark: '#353529', root: '#665a3e',
    bark: '#887247', barkLit: '#a18b57', mud: '#515538', mudLit: '#697047',
    mossDark: '#354e35', moss: '#52683b', mossLit: '#77884a', leaf: '#91a456',
    leafLit: '#b1bb6c', canopy: '#3c5b3a', canopyShade: '#283f31',
    waterDark: '#153c39', water: '#20534b', waterLit: '#2f6c5d',
    ripple: '#518571', reed: '#969158', flower: '#d8c685', stone: '#737a60'
  };
  const project = (x,y,z=0) => [320+x, 372+y*Math.sin(elevation)-z*Math.cos(elevation)];
  let seed = 3080640;
  const random = () => { seed = (Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; };
  const rect = (x,y,w,h,color) => {ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,Math.round(w)),Math.max(1,Math.round(h)));};
  function polygon(points,color) {
    ctx.fillStyle=color;
    const minY=Math.ceil(Math.min(...points.map(p=>p[1]))), maxY=Math.floor(Math.max(...points.map(p=>p[1])));
    for(let y=minY;y<=maxY;y++) {
      const xs=[];
      for(let i=0;i<points.length;i++) {
        const a=points[i],b=points[(i+1)%points.length],cy=y+0.5;
        if((a[1]<=cy && b[1]>cy)||(b[1]<=cy && a[1]>cy)) xs.push(a[0]+(cy-a[1])*(b[0]-a[0])/(b[1]-a[1]));
      }
      xs.sort((a,b)=>a-b);
      for(let i=0;i+1<xs.length;i+=2) ctx.fillRect(Math.ceil(xs[i]),y,Math.max(0,Math.ceil(xs[i+1])-Math.ceil(xs[i])),1);
    }
  }
  function ellipse(x,y,rx,ry,color) {
    ctx.fillStyle=color;
    for(let yy=Math.ceil(y-ry);yy<=Math.floor(y+ry);yy++) {
      const f=1-((yy+0.5-y)/ry)**2;
      if(f<0)continue;
      const half=rx*Math.sqrt(f),left=Math.ceil(x-half);
      ctx.fillRect(left,yy,Math.max(0,Math.ceil(x+half)-left),1);
    }
  }
  function line(a,b,width,color) {
    const length=Math.hypot(b[0]-a[0],b[1]-a[1])||1,dx=(b[1]-a[1])*width/length/2,dy=(a[0]-b[0])*width/length/2;
    polygon([[a[0]+dx,a[1]+dy],[b[0]+dx,b[1]+dy],[b[0]-dx,b[1]-dy],[a[0]-dx,a[1]-dy]],color);
  }
  const hex=Array.from({length:6},(_,i)=>{const a=(-90+i*60)*Math.PI/180;return [Math.cos(a)*280,Math.sin(a)*280];});
  const top=hex.map(([x,y])=>project(x,y));
  const bottom=hex.map(([x,y])=>project(x,y,-27));
  for(let i=1;i<=3;i++) polygon([top[i],top[i+1],bottom[i+1],bottom[i]],i===2?palette.peat:palette.peatLit);
  for(let i=0;i<170;i++) {
    const edge=1+Math.floor(random()*3),t=random(),a=top[edge],b=top[edge+1];
    const x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
    line([x,y+2],[x+(random()-.5)*9,y+8+random()*13],2+random()*3,random()>.7?palette.root:palette.peat);
  }
  polygon(top,palette.mud);
  function inside(x,y,margin=0) {
    const radius=280-margin;
    return Math.abs(x)<=radius*Math.sqrt(3)/2 && Math.abs(y)<=radius-Math.abs(x)/Math.sqrt(3);
  }
  function wet(x,y) {
    const pool=((x+28)/218)**2+((y-16)/208)**2;
    const island=Math.exp(-(((x-142)/62)**2+((y+48)/86)**2));
    return pool+island*.8+0.10*Math.sin(x/38+y/49)+0.06*Math.cos(y/19-x/61)<.88;
  }
  // Draw the surface in small color patches at full 640-pixel resolution.
  // Their deliberately varied 4/8/12-pixel sizes exercise grid detection.
  for(let sy=232;sy<513;sy+=4) for(let sx=76;sx<565;sx+=4) {
    const x=sx+2-320,y=(sy+2-372)/Math.sin(elevation);
    if(!inside(x,y,5))continue;
    const n=random(),waves=(Math.sin(x/29+y/11)+Math.cos(y/37-x/22))/2;
    let color;
    if(wet(x,y)) color=waves<-.35?palette.waterDark:waves>.45?palette.waterLit:palette.water;
    else color=n>.87?palette.mossLit:n>.58?palette.moss:n>.24?palette.mud:palette.mossDark;
    rect(sx,sy,4,4,color);
  }
  // Shallow bank shelves follow the visible front edges of the hex.
  for(let edge=1;edge<=3;edge++) {
    const a=top[edge],b=top[edge+1];
    for(let i=0;i<32;i++) {
      const t=(i+.3)/32,x=a[0]+(b[0]-a[0])*t,y=a[1]+(b[1]-a[1])*t;
      rect(x-4,y-3,8,3, i%4===0?palette.mossLit:palette.moss);
    }
  }
  for(let i=0;i<220;i++) {
    const x=(random()-.5)*440,y=(random()-.5)*465;
    if(!inside(x,y,24)||!wet(x,y))continue;
    const p=project(x,y);
    rect(p[0],p[1],4+Math.floor(random()*4)*4,2,random()>.38?palette.waterLit:palette.ripple);
  }
  // Ground-plane objects are projected using the same 30-degree view.
  function lily(x,y,r) {
    const p=project(x,y,2);
    ellipse(p[0]+2,p[1]+3,r+2,r*.5+1,palette.waterDark);
    ellipse(p[0],p[1],r,r*.5,palette.moss);
    ellipse(p[0]-1,p[1]-1,r-2,r*.5-1,palette.leaf);
    polygon([[p[0],p[1]],[p[0]+r,p[1]-3],[p[0]+r,p[1]+3]],palette.water);
    line([p[0]-r*.5,p[1]-1],[p[0]-1,p[1]-1],2,palette.leafLit);
  }
  [[-128,46,12],[-105,62,8],[-90,31,11],[-31,165,13],[0,176,8],[79,78,10],[-174,-34,10],[44,-71,9]].forEach(a=>lily(...a));
  const blossom=project(-123,45,7);
  rect(blossom[0]-3,blossom[1]-3,6,5,palette.flower);
  function reeds(x,y,scale=1) {
    const p=project(x,y);
    ellipse(p[0]+3,p[1]+2,17*scale,6*scale,palette.mossDark);
    for(let i=0;i<9;i++) {
      const dx=(random()-.5)*25*scale,height=(18+random()*25)*scale;
      line([p[0]+dx*.3,p[1]+2],[p[0]+dx,p[1]-height],2.5*scale,i%3===0?palette.leafLit:palette.mossLit);
      if(i%3===0)rect(p[0]+dx-2,p[1]-height-5,4*scale,11*scale,palette.root);
    }
  }
  function rock(x,y,scale=1) {
    const p=project(x,y);
    ellipse(p[0],p[1]+4,23*scale,9*scale,palette.mossDark);
    polygon([[-20,0],[-13,-15],[4,-22],[20,-10],[22,2],[0,8]].map(([x,y])=>[p[0]+x*scale,p[1]+y*scale]),palette.root);
    polygon([[-20,0],[-13,-15],[4,-22],[13,-12],[0,0]].map(([x,y])=>[p[0]+x*scale,p[1]+y*scale]),palette.stone);
    ellipse(p[0]-3*scale,p[1]-13*scale,14*scale,5*scale,palette.moss);
    rect(p[0]-13*scale,p[1]-14*scale,9*scale,3*scale,palette.mossLit);
  }
  function canopy(cx,cy,rx,ry) {
    // Stepped canopy silhouette, not smooth circles or a black outline.
    const points=[];
    for(let i=0;i<20;i++) {
      const angle=i/20*Math.PI*2,r=.88+random()*.18;
      points.push([Math.round((cx+Math.cos(angle)*rx*r)/4)*4,Math.round((cy+Math.sin(angle)*ry*r)/4)*4]);
    }
    polygon(points,palette.canopyShade);
    for(let i=0;i<42;i++) {
      const x=(random()-.5)*rx*1.6,y=(random()-.5)*ry*1.5;
      if((x/rx)**2+(y/ry)**2>.63)continue;
      const w=12+Math.floor(random()*5)*4,h=8+Math.floor(random()*3)*4;
      rect(cx+x-w/2,cy+y-h/2,w,h,y<0?(i%4===0?palette.mossLit:palette.moss):palette.canopy);
    }
    for(let i=0;i<8;i++) {
      const x=cx+(random()-.5)*rx*1.2,y=cy+ry*.55,h=10+random()*27;
      line([x,y],[x-3,y+h],3,palette.moss);
      rect(x-3,y+h,3,4,palette.mossLit);
    }
  }
  function cypress(x,y,height,lean) {
    const p=project(x,y),h=height*Math.cos(elevation);
    ellipse(p[0]+12,p[1]+5,43,13,palette.waterDark);
    const roots=[[-39,5],[-18,-6],[19,-7],[41,8],[7,17]];
    roots.forEach(([dx,dy])=> {
      line([p[0],p[1]-25],[p[0]+dx,p[1]+dy],9,palette.rootDark);
      line([p[0]-2,p[1]-22],[p[0]+dx,p[1]+dy],4,palette.root);
    });
    polygon([[p[0]-18,p[1]+4],[p[0]-10,p[1]-h*.5],[p[0]+lean-5,p[1]-h],
      [p[0]+lean+8,p[1]-h],[p[0]+8,p[1]-h*.45],[p[0]+23,p[1]+5]],palette.rootDark);
    polygon([[p[0]-9,p[1]+1],[p[0]-5,p[1]-h*.5],[p[0]+lean,p[1]-h],
      [p[0]+lean+5,p[1]-h],[p[0]+3,p[1]-h*.5],[p[0]+9,p[1]+4]],palette.bark);
    line([p[0]-4,p[1]-10],[p[0]+lean+1,p[1]-h*.87],3,palette.barkLit);
    [[-.75,-.60],[.85,-.72],[-.35,-.92]].forEach(([dx,dy])=> {
      line([p[0]+lean*.5,p[1]-h*.52],[p[0]+dx*67+lean,p[1]+dy*h],9,palette.root);
    });
    canopy(p[0]+lean-38,p[1]-h*.67,54,37);
    canopy(p[0]+lean+37,p[1]-h*.77,62,43);
    canopy(p[0]+lean-6,p[1]-h,58,43);
    ellipse(p[0]-6,p[1]-3,14,5,palette.moss);
  }
  const objects=[
    {y:-162,draw:()=>cypress(-104,-162,194,-15)},
    {y:-98,draw:()=>cypress(142,-98,237,19)},
    {y:113,draw:()=>cypress(-177,113,135,-10)},
    {y:-202,draw:()=>reeds(22,-202,.75)},
    {y:-115,draw:()=>reeds(-196,-115,.8)},
    {y:168,draw:()=>reeds(108,168,1.1)},
    {y:203,draw:()=>reeds(-53,203,.85)},
    {y:52,draw:()=>reeds(208,52,.85)},
    {y:62,draw:()=>rock(173,62,.95)},
    {y:177,draw:()=>rock(-126,177,.7)},
    {y:-227,draw:()=>rock(-31,-227,.55)},
    {y:103,draw:()=>{
      const a=project(-46,101,7),b=project(47,116,7);
      line([a[0],a[1]+5],[b[0],b[1]+5],16,palette.waterDark);
      line(a,b,14,palette.rootDark);line([a[0],a[1]-3],[b[0],b[1]-3],6,palette.bark);
      for(let i=0;i<6;i++)rect(a[0]+i*15,a[1]-7+i,9,4,palette.moss);
      ellipse(b[0],b[1],5,7,palette.barkLit);ellipse(b[0],b[1],2,4,palette.root);
    }}
  ];
  objects.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
  const small=root.querySelector('#swamp-small'),smallContext=small.getContext('2d');
  // Match Aseprite's nearest-neighbor sampling origin exactly. Browser
  // drawImage uses a different sample center for a 10:1 reduction.
  const original=ctx.getImageData(0,0,640,640).data;
  const reduced=smallContext.createImageData(64,64);
  for(let y=0;y<64;y++)for(let x=0;x<64;x++) {
    const source=(y*10*640+x*10)*4,destination=(y*64+x)*4;
    for(let channel=0;channel<4;channel++)reduced.data[destination+channel]=original[source+channel];
  }
  smallContext.putImageData(reduced,0,0);
})();
</script>
